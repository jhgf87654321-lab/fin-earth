<!DOCTYPE html>
<html lang="zh">

<head>
  <title>财经地球站 · 新浪 7×24</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@500;700&display=swap');

  :root {
    --bg: #010826;
    --panel: rgba(6, 18, 48, 0.92);
    --line: rgba(64, 158, 255, 0.35);
    --accent: #0cd1eb;
    --text: #e8f1ff;
    --muted: #8aa0c2;
  }

  html,
  body {
    height: 100%;
    width: 100%;
    padding: 0;
    margin: 0;
  }

  body {
    overflow: hidden;
    position: relative;
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }

  #earth-canvas {
    height: 100%;
    flex: 1;
    min-width: 0;
    background: radial-gradient(ellipse at center, #0a1a3a 0%, #010826 70%);
  }

  #html2canvas {
    position: absolute;
    z-index: -1;
    left: 0;
    top: 0;
    background: rgba(0, 0, 0, 0);
  }

  .css3d-wapper {
    pointer-events: none;
    color: #fff;
  }

  .css3d-wapper .fire-div {
    font-size: 20px;
    font-weight: 600;
    border-top: 3px solid #0cd1eb;
    padding: 6px 8px;
    min-width: 50px;
    background: rgba(40, 108, 181, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .brand {
    position: absolute;
    left: 24px;
    top: 20px;
    z-index: 20;
    pointer-events: none;
  }

  .brand h1 {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: #fff;
  }

  .brand p {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  #news-sidebar {
    position: relative;
    width: 400px;
    flex-shrink: 0;
    height: 100%;
    z-index: 30;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(4, 16, 42, 0.96), rgba(1, 8, 28, 0.98));
    border-left: 1px solid var(--line);
    backdrop-filter: blur(10px);
    box-shadow: -12px 0 40px rgba(0, 0, 0, 0.35);
  }

  .news-header {
    padding: 18px 18px 10px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .news-header h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  .news-header .meta {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .news-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .news-actions button {
    border: 1px solid var(--line);
    background: rgba(12, 209, 235, 0.08);
    color: var(--accent);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 12px;
  }

  .news-actions button:hover {
    background: rgba(12, 209, 235, 0.18);
  }

  #news-tabs {
    display: flex;
    flex-wrap: nowrap;
    gap: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
  }

  .news-tab {
    flex: 0 0 auto;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.04);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
  }

  .news-tab span {
    margin-left: 6px;
    opacity: 0.7;
  }

  .news-tab.active {
    color: #01101f;
    background: var(--accent);
    border-color: var(--accent);
  }

  #news-list {
    list-style: none;
    margin: 0;
    padding: 8px 0 24px;
    overflow-y: auto;
    flex: 1;
  }

  .news-item {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(64, 158, 255, 0.12);
  }

  .news-item:hover {
    background: rgba(12, 209, 235, 0.06);
  }

  .news-item-time {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .news-item-text {
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);
  }

  #news-empty {
    display: none;
    padding: 28px 18px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }

  .hint {
    position: absolute;
    left: 24px;
    bottom: 20px;
    z-index: 20;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
  }

  #loading {
    position: absolute;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    z-index: 999;
    background: #010826;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #409EFF;
    font-size: 15px;
    letter-spacing: 2px;
    overflow: hidden;
  }

  @keyframes zoomOut {
    0% {
      opacity: 1
    }

    50% {
      opacity: 0;
      transform: scale3d(1.3, 1.3, 1.3)
    }

    to {
      opacity: 0
    }
  }

  #loading.out {
    animation: zoomOut 0.5s linear forwards;
    pointer-events: none;
  }

  #loading.out .sk-chase-dot,
  #loading.out .sk-chase {
    animation: null;
  }

  .sk-chase {
    margin-bottom: 20px;
    width: 40px;
    height: 40px;
    position: relative;
    animation: sk-chase 2.5s infinite linear both;
  }

  .sk-chase-dot {
    width: 100%;
    height: 100%;
    position: absolute;
    left: 0;
    top: 0;
    animation: sk-chase-dot 2s infinite ease-in-out both;
  }

  .sk-chase-dot::before {
    content: '';
    display: block;
    width: 20%;
    height: 20%;
    background-color: #409EFF;
    border-radius: 100%;
    animation: sk-chase-dot-before 2s infinite ease-in-out both;
  }

  .sk-chase-dot:nth-child(1) {
    animation-delay: -1.1s;
  }

  .sk-chase-dot:nth-child(2) {
    animation-delay: -1s;
  }

  .sk-chase-dot:nth-child(3) {
    animation-delay: -0.9s;
  }

  .sk-chase-dot:nth-child(4) {
    animation-delay: -0.8s;
  }

  .sk-chase-dot:nth-child(5) {
    animation-delay: -0.7s;
  }

  .sk-chase-dot:nth-child(6) {
    animation-delay: -0.6s;
  }

  .sk-chase-dot:nth-child(1):before {
    animation-delay: -1.1s;
  }

  .sk-chase-dot:nth-child(2):before {
    animation-delay: -1s;
  }

  .sk-chase-dot:nth-child(3):before {
    animation-delay: -0.9s;
  }

  .sk-chase-dot:nth-child(4):before {
    animation-delay: -0.8s;
  }

  .sk-chase-dot:nth-child(5):before {
    animation-delay: -0.7s;
  }

  .sk-chase-dot:nth-child(6):before {
    animation-delay: -0.6s;
  }

  @keyframes sk-chase {
    100% {
      transform: rotate(360deg);
    }
  }

  @keyframes sk-chase-dot {

    80%,
    100% {
      transform: rotate(360deg);
    }
  }

  @keyframes sk-chase-dot-before {
    50% {
      transform: scale(0.4);
    }

    100%,
    0% {
      transform: scale(1);
    }
  }

  @media (max-width: 768px) {
    body {
      flex-direction: column;
    }

    #earth-canvas {
      height: 58%;
      flex: none;
      width: 100%;
    }

    #news-sidebar {
      width: 100%;
      height: 42%;
      border-left: none;
      border-top: 1px solid var(--line);
    }

    .brand {
      left: 14px;
      top: 12px;
    }

    .hint {
      display: none;
    }
  }
</style>

<body>
  <div id="loading">
    <div class="sk-chase">
      <div class="sk-chase-dot"></div>
      <div class="sk-chase-dot"></div>
      <div class="sk-chase-dot"></div>
      <div class="sk-chase-dot"></div>
      <div class="sk-chase-dot"></div>
      <div class="sk-chase-dot"></div>
    </div>
    <div>加载资源中...</div>
  </div>
  <div id="html2canvas" class="css3d-wapper">
    <div class="fire-div"></div>
  </div>
  <div class="brand">
    <h1>FIN EARTH</h1>
    <p>新浪财经 7×24 · 城市标点联动</p>
  </div>
  <div class="hint">拖拽旋转地球 · 点击光柱查看地区快讯</div>
  <div id="earth-canvas"></div>
  <aside id="news-sidebar">
    <div class="news-header">
      <div>
        <h2 id="news-title">全球财经快讯</h2>
        <div class="meta" id="news-meta">等待数据…</div>
      </div>
      <div class="news-actions">
        <button type="button" id="news-refresh">刷新</button>
        <button type="button" id="news-close">全部</button>
      </div>
    </div>
    <div id="news-tabs"></div>
    <div id="news-empty">暂无快讯</div>
    <ul id="news-list"></ul>
  </aside>
</body>

</html>
